<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>MS-Japan 総合TOP（ワイヤー）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:'Noto Sans JP','Hiragino Sans',sans-serif;background:#f6f6f6;color:#1a1b1c}
.wrap{height:100%;display:grid;place-items:center;padding:24px}
.card{width:100%;max-width:420px;background:#fff;border-radius:16px;padding:40px 36px;
  box-shadow:0 2px 8px rgba(20,30,60,.06),0 24px 60px rgba(20,30,60,.10);text-align:center}
h1{font-size:19px;font-weight:900;margin:0 0 6px;color:#015296}
p.d{font-size:13px;color:#6e727c;margin:0 0 24px;line-height:1.75;font-weight:500}
input{width:100%;height:52px;border:2px solid #e2e6f0;border-radius:10px;padding:0 16px;font:inherit;
  font-size:16px;text-align:center;letter-spacing:.1em;outline:none;transition:border-color .15s}
input:focus{border-color:#015296}
.pw{position:relative}
.pw input{padding:0 52px}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:auto;height:40px;margin:0;padding:0 12px;
  border-radius:8px;background:none;color:#545454;font-size:13px;font-weight:700}
.eye:hover{background:#f2f2f4}
button{width:100%;height:52px;margin-top:14px;border:0;border-radius:999px;background:#015296;color:#fff;
  font:inherit;font-size:15px;font-weight:900;cursor:pointer}
button[disabled]{opacity:.5;cursor:default}
.err{color:#ba1a1a;font-size:13px;font-weight:700;margin-top:14px;min-height:20px}
.cf{margin-top:26px;font-size:10.5px;letter-spacing:.14em;font-weight:900;color:#9096a1}
.w{display:none}
</style></head>
<body><div class="wrap"><div class="card" id="card">
  <h1>MS-Japan 総合TOP（ワイヤー）</h1>
  <p class="d">合言葉を入力してください。<br>ご不明な場合は担当までお問い合わせください。</p>
  <form id="f"><div class="pw"><input id="p" type="password" autocomplete="off" placeholder="合言葉" autofocus>
  <button type="button" class="eye" id="eye" aria-label="合言葉を表示">表示</button></div>
  <button id="b" type="submit">開く</button></form>
  <div class="err" id="e"></div>
  <div class="cf">CONFIDENTIAL</div>
</div></div>
<script>
var SALT = "hqAR4ym+ZyTJCTwChsyCiA==", ITER = 150000, PROBE = "2c6a6448297044019de580709e4c9032";
var b2u = function(b){ var s=atob(b), u=new Uint8Array(s.length); for(var i=0;i<s.length;i++) u[i]=s.charCodeAt(i); return u; };
var next = new URLSearchParams(location.search).get("next") || "";
if(!/^[?#]/.test(next)) next = "";
var go = new URLSearchParams(location.search).get("go") || "";
if(["index.html","alt.html"].indexOf(go.split(/[?#]/)[0]) < 0) go = "";

async function deriveRaw(pass){
  var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2", salt:b2u(SALT), iterations:ITER, hash:"SHA-256"}, base, 256));
}
async function check(raw){
  var key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
  var r = await fetch("enc/" + PROBE + ".bin", {cache:"no-cache"});
  if(!r.ok) throw new Error("LOAD");
  var buf = new Uint8Array(await r.arrayBuffer());
  await crypto.subtle.decrypt({name:"AES-GCM", iv:buf.slice(0,12)}, key, buf.slice(12)); // 違えば例外
}
var PW_KEY = "msjapan_top_pw"; // 資料ページ（bs_pw）とは別に保存
async function open_(pass){
  pass = String(pass || "").trim().toLowerCase();
  var raw = await deriveRaw(pass);
  await check(raw);
  if(!("serviceWorker" in navigator)) throw new Error("このブラウザでは表示できません（Service Worker 非対応）");
  var reg = await navigator.serviceWorker.register("sw.js", {scope:"./"});
  await navigator.serviceWorker.ready;
  var sw = reg.active || reg.waiting || reg.installing;
  await new Promise(function(res){
    navigator.serviceWorker.addEventListener("message", function h(ev){ if(ev.data && ev.data.type==="key-ok"){ navigator.serviceWorker.removeEventListener("message", h); res(); } });
    sw.postMessage({type:"key", raw: raw.buffer}, [raw.buffer]);
    setTimeout(res, 3000);
  });
  try { localStorage.setItem(PW_KEY, pass); } catch(e) {}
  location.replace(go ? "app/" + go : "app/index.html" + next);
}
document.getElementById("eye").addEventListener("click", function(){
  var p = document.getElementById("p"), show = p.type === "password";
  p.type = show ? "text" : "password";
  this.textContent = show ? "隠す" : "表示";
  this.setAttribute("aria-label", show ? "合言葉を隠す" : "合言葉を表示");
  p.focus();
});
document.getElementById("f").addEventListener("submit", async function(ev){
  ev.preventDefault();
  var b = document.getElementById("b"), e = document.getElementById("e");
  b.disabled = true; e.textContent = "確認中…";
  try { await open_(document.getElementById("p").value); }
  catch(err){ e.textContent = (err && /Service Worker/.test(err.message)) ? err.message
    : (err && err.message === "LOAD") ? "読み込みに失敗しました。ページを再読み込みしてください" : "合言葉が違います"; b.disabled = false; document.getElementById("p").select(); }
});
(async function(){
  var saved = null; try { saved = localStorage.getItem(PW_KEY); } catch(e) {}
  if(saved){ document.getElementById("e").textContent = "開いています…"; try { await open_(saved); return; } catch(e) {} document.getElementById("e").textContent = ""; }
})();
</script>
</body></html>
